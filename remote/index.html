<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071447">
<title>Uber TV Remote</title>
<style>
  /* The page's frame. Everything a template styles is set from its checked
     values by the script below (Remote.js resolves templates on the TV). */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body {
    background: #030a2b; color: #f2f4ff;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  main {
    width: 100%; max-width: 464px; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding: max(6px, env(safe-area-inset-top)) 12px max(8px, env(safe-area-inset-bottom));
  }
  main.wide { max-width: 940px; }
  header { flex: none; height: 34px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { margin: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hidden { display: none !important; }

  /* Pairing (before a phone has a template: Uber TV's own look) */
  .pair { color: #f2f4ff; font-family: ui-monospace, Menlo, monospace; }
  .pair p { color: #9fb0f0; line-height: 1.5; }
  .pair input {
    width: 100%; font: inherit; font-size: 32px; letter-spacing: .4em; text-align: center;
    padding: 14px; margin: 10px 0; background: #030a2b; color: #f2f4ff;
    border: 2px solid #3b5bd1; border-radius: 6px;
  }
  .pair input:focus { outline: none; border-color: #ffd23f; }
  .pair .error { color: #ff4d4d; min-height: 1.4em; }
  .pair button { width: 100%; min-height: 56px; font: inherit; font-weight: bold; font-size: 18px; color: #0b1550;
                 background: #ffd23f; border: 1px solid #fff3b8; border-radius: 8px; box-shadow: 0 3px 0 #8a6d10; }

  #area { flex: 1; min-height: 0; position: relative; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .col { display: flex; flex-direction: column; }
  .cols { display: flex; gap: 16px; align-items: flex-start; }
  .row { display: flex; align-items: center; flex: none; }
  .row.dim { opacity: .35; pointer-events: none; }
  .cell { position: relative; flex: none; height: 100%; display: flex; align-items: center; justify-content: center; min-width: 0; }
  .panel { flex: none; display: flex; flex-direction: column; position: relative; }
  .rise { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  .grab { align-self: center; flex: none; }

  button { font: inherit; }
  .k {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2em;
    border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
    background: transparent; color: inherit; line-height: 1.1; white-space: nowrap; overflow: visible;
  }
  .face { position: absolute; inset: 0; pointer-events: none; z-index: -1; }
  .k > .in { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .25em; }
  .k svg, .ico { flex: none; }
  .zone { position: absolute; border: 0; padding: 0; margin: 0; background: transparent; cursor: pointer; touch-action: manipulation; }

  .card { position: relative; display: flex; align-items: center; width: 100%; height: 100%; overflow: hidden; }
  .card .side { flex: none; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card .side img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .lines { min-width: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .card .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
  .card .line.title { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .barbox { position: relative; width: 100%; }
  .barbox .track, .barbox .fill { position: absolute; left: 0; }
  .barbox .knob { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); }
  .barlabels { display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; }

  .list { width: 100%; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .chan { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .chan .text { min-width: 0; flex: 1; }
  .chan .text div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chan img { flex: none; object-fit: cover; }

  .strip { display: flex; width: 100%; height: 100%; align-items: stretch; }
  .strip > div { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; }

  .over { position: absolute; left: 0; right: 0; top: 0; z-index: 5; display: flex; align-items: center; justify-content: center; gap: 12px; }
  .over small { letter-spacing: .1em; opacity: .75; }
  .ask p { margin: 0 0 8px; line-height: 1.35; }
  .ask .answers { display: flex; gap: 8px; height: 44px; }

  .shade { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .55); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 464px; max-height: 88dvh; overflow-y: auto; padding-bottom: max(16px, env(safe-area-inset-bottom)) !important; }
  .sheet h2 { margin: 0; font-size: 15px; letter-spacing: .12em; }
  .sheet .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sheet .label { font-size: 11px; letter-spacing: .12em; margin: 16px 0 8px; opacity: .8; }
  .sheet .pick { display: flex; flex-direction: column; align-items: flex-start; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 6px; white-space: normal; }
  .sheet .pick small { font-weight: normal; opacity: .75; margin-top: 3px; font-size: 12px; line-height: 1.3; }
  .sheet .pair2 { display: flex; gap: 8px; height: 48px; }
  .sheet .sizes { display: flex; gap: 8px; align-items: center; height: 48px; }
  .sheet .sizes span { flex: 1; text-align: center; }
  .sheet .unpair { margin-top: 22px; height: 48px; width: 100%; }
  .pin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pin .k { height: 54px; }
</style>
</head>
<body>
<main id="main">
  <header id="head"><h1 id="title">UBER TV · REMOTE</h1><button class="k hidden" id="gear" type="button" aria-label="Settings"></button></header>

  <section id="pair" class="pair hidden">
    <p>On your computer, open Uber TV and press <b>T</b>. Enter the 6-digit code shown there, or scan its QR code.</p>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······">
    <div class="error" id="pairError"></div>
    <button id="pairButton" type="button">PAIR THIS PHONE</button>
  </section>

  <section id="area" class="hidden"></section>
</main>
<script>
  const $ = (s) => document.querySelector(s)
  const NS = "http://www.w3.org/2000/svg"

  // What the TV says (the event stream), the template drawn, and this phone's choices
  let state = {}
  let tpl = null
  let prefs = { template: null, pad: null, size: 0 }
  let names = []
  let rev = null
  let fetching = false
  let view = { tab: "remote", expanded: false, settings: false }
  let typed = ""
  let typedTimer = null
  let events = null
  let updaters = []
  let U = 3.9                 // one unit: 1% of the width, in pixels
  let SZ = 1                  // the size pref: text and icons grow or shrink
  let built = ""

  // ---- checked values only: anything else is dropped ----------------------
  const HEX = /^#[0-9a-f]{6}([0-9a-f]{2})?$/
  const col = (v) => typeof v === "string" && (HEX.test(v) || v === "transparent") ? v : "transparent"
  const fin = (v, d) => typeof v === "number" && isFinite(v) ? v : (d || 0)
  const px = (v) => Math.max(0, fin(v)) * U
  const off = (v) => fin(v) * U          // a shadow's offset: either way
  const DIRS = { down: "to bottom", up: "to top", right: "to right", left: "to left" }
  const CASES = { upper: "uppercase", lower: "lowercase", title: "capitalize", none: "none" }
  const SHAPES = ["rect", "pill", "circle", "chamfer"]
  const FAMILY = {
    system: '-apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif',
    "dm-mono": '"UTV DM Mono", ui-monospace, Menlo, monospace',
    "dm-mono-medium": '"UTV DM Mono Medium", ui-monospace, Menlo, monospace',
    orbitron: '"UTV Orbitron", -apple-system, system-ui, sans-serif',
  }
  const FONT_FILES = { "dm-mono": ["UTV DM Mono", "url(/api/font/dm-mono)"], "dm-mono-medium": ["UTV DM Mono Medium", "url(/api/font/dm-mono-medium)"],
                       orbitron: ["UTV Orbitron", "url(/api/font/orbitron)"] }
  const fontsAdded = {}
  function loadFont(id) {
    if (!FONT_FILES[id] || fontsAdded[id] || typeof FontFace === "undefined") return
    fontsAdded[id] = true
    const f = new FontFace(FONT_FILES[id][0], FONT_FILES[id][1])
    f.load().then(() => { document.fonts.add(f); built = ""; draw() }).catch(() => {})
  }

  const KEYS = ["power", "mute", "options", "back", "guide", "window", "home", "live", "rewind", "playpause", "forward", "padToggle",
                "expand", "collapse", "chup", "chdown", "arrow", "ok", "digit", "erase", "go", "rocker"]
  const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v)
  function merge(a, b) {
    if (!isObj(b)) return isObj(a) ? merge({}, a) : (b === undefined ? a : b)
    const out = isObj(a) ? Object.assign({}, a) : {}
    for (const k of Object.keys(b)) out[k] = isObj(out[k]) && isObj(b[k]) ? merge(out[k], b[k]) : b[k]
    return out
  }
  // An element's style (a key starts from the key element's), and what a
  // state changes on top of it
  function extra(name, st) {
    const S = (tpl && tpl.styles) || {}
    return merge(KEYS.indexOf(name) >= 0 ? S["key:" + st] : {}, S[name + ":" + st]) || {}
  }
  function sty(name, st) {
    const S = (tpl && tpl.styles) || {}
    let s = merge(KEYS.indexOf(name) >= 0 ? S.key : {}, S[name]) || {}
    if (st) s = merge(s, extra(name, st))
    return s || {}
  }

  // the top left and bottom right corners cut
  function chamfer(c) {
    return "polygon(" + c + "px 0, 100% 0, 100% calc(100% - " + c + "px), calc(100% - " + c + "px) 100%, 0 100%, 0 " + c + "px)"
  }
  function fillOf(f) {
    if (isObj(f)) return "linear-gradient(" + (DIRS[f.direction] || "to bottom") + ", " + col(f.from) + ", " + col(f.to) + ")"
    return col(f)
  }
  // A box's look (fill, border, corners, shape, shadow, padding, opacity).
  // A chamfered box draws its border as its own fill showing round an inner
  // face (a key brings its own; anything else gets one, under its content)
  function ownFace(el) {
    if (!el._face || el._face.parentNode !== el) { el._face = div("face"); el.insertBefore(el._face, el.firstChild) }
    return el._face
  }
  function box(el, s, face) {
    const st = el.style
    if (!s) return
    const shape = SHAPES.indexOf(s.shape) >= 0 ? s.shape : "rect"
    const b = isObj(s.border) ? s.border : null
    const bw = b && fin(b.width) > 0 ? Math.max(1, px(b.width)) : 0
    if (shape === "chamfer" && bw && !face) face = ownFace(el)
    if (shape === "chamfer") {
      const c = Math.max(2, px(s.radius === undefined ? 3 : (Array.isArray(s.radius) ? s.radius[0] : s.radius)))
      st.clipPath = chamfer(c)
      st.background = bw ? col(b.color) : fillOf(s.fill)
      if (face && bw) {
        face.style.clipPath = chamfer(Math.max(1, c - bw * 0.6))
        face.style.inset = bw + "px"
        face.style.background = fillOf(s.fill)
      }
      if (isObj(s.shadow)) st.filter = "drop-shadow(" + off(s.shadow.x) + "px " + off(s.shadow.y) + "px " + px(s.shadow.blur) + "px " + col(s.shadow.color) + ")"
    } else {
      if (s.fill !== undefined) st.background = fillOf(s.fill)
      if (bw) {
        const line = bw + "px solid " + col(b.color)
        const sides = Array.isArray(b.sides) ? b.sides : ["top", "right", "bottom", "left"]
        for (const side of sides) if (["top", "right", "bottom", "left"].indexOf(side) >= 0) st["border" + side[0].toUpperCase() + side.slice(1)] = line
      }
      if (shape === "pill") st.borderRadius = "999px"
      else if (shape === "circle") st.borderRadius = "50%"
      else if (Array.isArray(s.radius)) st.borderRadius = s.radius.map((r) => px(r) + "px").join(" ")
      else if (s.radius !== undefined) st.borderRadius = px(s.radius) + "px"
      if (isObj(s.shadow)) st.boxShadow = off(s.shadow.x) + "px " + off(s.shadow.y) + "px " + px(s.shadow.blur) + "px " + col(s.shadow.color)
    }
    if (s.padding !== undefined) st.padding = px(s.padding) + "px"
    if (s.opacity !== undefined) st.opacity = String(Math.min(1, Math.max(0.1, fin(s.opacity, 1))))
  }
  // Its text: color, font, size, weight, case, spacing
  function text(el, s) {
    const t = s && isObj(s.text) ? s.text : null
    if (!t) return
    const st = el.style
    if (t.color !== undefined) st.color = col(t.color)
    if (t.font !== undefined) { st.fontFamily = FAMILY[t.font] || FAMILY.system; loadFont(t.font) }
    if (t.size !== undefined) st.fontSize = (px(t.size) * SZ).toFixed(1) + "px"
    if (t.weight !== undefined) st.fontWeight = String(Math.round(Math.min(900, Math.max(100, fin(t.weight, 400))) / 100) * 100)
    if (t.case !== undefined) st.textTransform = CASES[t.case] || "none"
    if (t.letterSpacing !== undefined) st.letterSpacing = Math.max(-0.2, Math.min(1, fin(t.letterSpacing))) + "em"
    if (t.italic !== undefined) st.fontStyle = t.italic === true ? "italic" : "normal"
  }
  function looks(el, s, face) { box(el, s, face); text(el, s) }
  function reset(el, keep) { el.removeAttribute("style"); if (keep) Object.assign(el.style, keep) }

  // ---- the icons the page draws (a fixed set, 24 by 24) ----------------------
  const ICONS = {
    play: [["path", { d: "M8 5.2v13.6a.8.8 0 0 0 1.2.7l10.6-6.8a.8.8 0 0 0 0-1.4L9.2 4.5A.8.8 0 0 0 8 5.2z", fill: "currentColor", stroke: "none" }]],
    pause: [["rect", { x: 6, y: 4.5, width: 4.3, height: 15, rx: 1.4, fill: "currentColor", stroke: "none" }], ["rect", { x: 13.7, y: 4.5, width: 4.3, height: 15, rx: 1.4, fill: "currentColor", stroke: "none" }]],
    rewind: [["path", { d: "M4.3 12a7.7 7.7 0 1 0 2.3-5.5" }], ["path", { d: "M6.6 2.6v3.9h3.9" }], ["text", { x: 12.3, y: 15, "font-size": 6.6, "font-weight": 700, "text-anchor": "middle", fill: "currentColor", stroke: "none" }, "30"]],
    forward: [["path", { d: "M19.7 12a7.7 7.7 0 1 1-2.3-5.5" }], ["path", { d: "M17.4 2.6v3.9h-3.9" }], ["text", { x: 11.7, y: 15, "font-size": 6.6, "font-weight": 700, "text-anchor": "middle", fill: "currentColor", stroke: "none" }, "30"]],
    power: [["path", { d: "M12 3.5v8" }], ["path", { d: "M6.7 7.2a7.5 7.5 0 1 0 10.6 0" }]],
    mute: [["path", { d: "M3.8 9.3h3.3L12 5.3v13.4l-4.9-4H3.8z", fill: "currentColor" }], ["path", { d: "M15.8 9.4l5 5M20.8 9.4l-5 5" }]],
    sound: [["path", { d: "M3.8 9.3h3.3L12 5.3v13.4l-4.9-4H3.8z", fill: "currentColor" }], ["path", { d: "M15.5 9a4.2 4.2 0 0 1 0 6M18.3 6.5a8 8 0 0 1 0 11" }]],
    window: [["path", { d: "M8 14.5H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v3.5" }], ["rect", { x: 8, y: 9.5, width: 13, height: 10, rx: 2 }]],
    home: [["path", { d: "M4 10.4L12 4l8 6.4V19a1 1 0 0 1-1 1h-4.6v-5.6H9.6V20H5a1 1 0 0 1-1-1z" }]],
    guide: [["path", { d: "M4 6.5h3.5M10.5 6.5H20M4 12h3.5M10.5 12h5M18.5 12H20M4 17.5h3.5M10.5 17.5H20" }]],
    back: [["path", { d: "M9.5 5L4 10.5 9.5 16" }], ["path", { d: "M4 10.5h10.5a5.5 5.5 0 0 1 0 11H12" }]],
    dots: [["circle", { cx: 5, cy: 12, r: 1.8, fill: "currentColor", stroke: "none" }], ["circle", { cx: 12, cy: 12, r: 1.8, fill: "currentColor", stroke: "none" }], ["circle", { cx: 19, cy: 12, r: 1.8, fill: "currentColor", stroke: "none" }]],
    up: [["path", { d: "M5.5 15.5L12 9l6.5 6.5" }]],
    down: [["path", { d: "M5.5 8.5L12 15l6.5-6.5" }]],
    left: [["path", { d: "M15.5 5.5L9 12l6.5 6.5" }]],
    right: [["path", { d: "M8.5 5.5L15 12l-6.5 6.5" }]],
    erase: [["path", { d: "M9 5h10.5A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5H9l-6-7z" }], ["path", { d: "M11.8 9.5l5 5M16.8 9.5l-5 5" }]],
    more: [["rect", { x: 4, y: 4, width: 6.5, height: 6.5, rx: 2 }], ["rect", { x: 13.5, y: 4, width: 6.5, height: 6.5, rx: 2 }], ["rect", { x: 4, y: 13.5, width: 6.5, height: 6.5, rx: 2 }], ["rect", { x: 13.5, y: 13.5, width: 6.5, height: 6.5, rx: 2 }]],
    collapse: [["path", { d: "M5.5 8.5L12 15l6.5-6.5" }]],
    gear: [["circle", { cx: 12, cy: 12, r: 3 }], ["path", { d: "M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.85 1.85M16.65 16.65l1.85 1.85M5.5 18.5l1.85-1.85M16.65 7.35l1.85-1.85" }], ["circle", { cx: 12, cy: 12, r: 6.4 }]],
    tri: { up: "▲", down: "▼", left: "◀", right: "▶" },
  }
  function icon(name, size) {
    const svg = document.createElementNS(NS, "svg")
    svg.setAttribute("viewBox", "0 0 24 24")
    svg.setAttribute("width", String(Math.round(size)))
    svg.setAttribute("height", String(Math.round(size)))
    svg.setAttribute("fill", "none")
    svg.setAttribute("stroke", "currentColor")
    svg.setAttribute("stroke-width", "1.9")
    svg.setAttribute("stroke-linecap", "round")
    svg.setAttribute("stroke-linejoin", "round")
    svg.setAttribute("aria-hidden", "true")
    svg.setAttribute("class", "ico")
    for (const part of ICONS[name] || []) {
      const el = document.createElementNS(NS, part[0])
      for (const a of Object.keys(part[1])) el.setAttribute(a, String(part[1][a]))
      if (part[2]) el.textContent = part[2]
      svg.appendChild(el)
    }
    return svg
  }
  const div = (cls) => { const d = document.createElement("div"); if (cls) d.className = cls; return d }
  const span = (txt) => { const s = document.createElement("span"); s.textContent = txt; return s }

  // ---- talking to the TV ---------------------------------------------------
  const post = (path, body) => fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Remote": "1" },
    body: JSON.stringify(body || {}),
  })

  function show(which) {
    $("#pair").classList.toggle("hidden", which !== "pair")
    $("#area").classList.toggle("hidden", which !== "remote")
    $("#gear").classList.toggle("hidden", which !== "remote")
    if (which === "pair") { $("#title").textContent = "UBER TV · REMOTE"; setTimeout(() => $("#code").focus(), 100) }
  }

  async function start() {
    const r = await fetch("/api/state").catch(() => null)
    if (!r) return setTimeout(start, 3000)
    if (r.status === 401) return show("pair")
    show("remote")
    render(await r.json())
    listen()
  }

  function listen() {
    if (events) events.close()
    events = new EventSource("/api/events")
    events.onmessage = (e) => render(JSON.parse(e.data))
    events.onerror = () => { events.close(); events = null; setTimeout(start, 3000) }
  }

  // This phone's template and choices, again whenever the TV says they changed
  // The newest revision asked for wins; rev moves only once a good answer is
  // drawn, and a fetch that fails is tried again a little later (the page's
  // own Classic meanwhile, if it has nothing yet)
  let wanted = undefined
  let again = false
  let failures = 0
  let retryTimer = null
  async function fetchRemote(want, tries) {
    if (want !== undefined) wanted = want
    if (fetching) { again = true; return }
    fetching = true
    again = false
    const r = await fetch("/api/remote").catch(() => null)
    if (r && r.status === 401) { fetching = false; return show("pair") }
    const got = r && r.ok ? await r.json().catch(() => null) : null
    fetching = false
    clearTimeout(retryTimer)
    if (!got || !isObj(got)) {
      failures += 1
      if (!tpl) draw()
      retryTimer = setTimeout(() => fetchRemote(), Math.min(30000, 1000 * Math.pow(2, Math.min(failures, 5))))
      return
    }
    failures = 0
    rev = got.rev
    const g = got.template
    tpl = isObj(g) && isObj(g.layout) && Array.isArray(g.layout.portrait) && isObj(g.styles) && isObj(g.colors) ? g : null
    prefs = isObj(got.prefs) ? got.prefs : prefs
    names = Array.isArray(got.list) ? got.list : []
    draw()
    // a newer revision told meanwhile: once more (never more than a few times in a row)
    if ((again || (wanted !== undefined && wanted !== rev)) && (tries || 0) < 3) fetchRemote(undefined, (tries || 0) + 1)
  }

  async function pair() {
    $("#pairError").textContent = ""
    const r = await post("/api/pair", { code: $("#code").value }).catch(() => null)
    if (r && r.ok) return start()
    const why = r ? (await r.json().catch(() => ({}))).error : "Can't reach the guide."

    // beside the lines: the logo (or initials), or the number
    const sideSize = Math.min(h - pad * 2, Math.round(px(fin(sty("nowLogo").size, 14))))
    const update = () => {
      for (const r of rows) r.update()
      if (sideKind === "none") return
      side.textContent = ""

        side.textContent = n && !n.vod ? String(n.number) : ""

      else if (n) side.textContent = initials(n.vod ? n.name : n.name)

  function barRow(w) {
    const wrap = div()
    wrap.style.width = "100%"
    const s = sty("bar")
    const bh = Math.max(2, px(fin(s.height, 0.9)))
    const bar = div("barbox")
    bar.style.height = Math.max(bh, px(3.6)) + "px"
    bar.style.margin = px(1.4) + "px 0 " + px(0.8) + "px"
    const track = div("track"), fill = div("fill"), knob = div("knob")
    const r = s.radius !== undefined ? px(s.radius) : bh / 2
    for (const el of [track, fill]) Object.assign(el.style, { height: bh + "px", top: "50%", marginTop: -bh / 2 + "px", borderRadius: r + "px" })
    track.style.width = "100%"
    track.style.background = col(s.track)
    fill.style.background = fillOf(s.fill)
    const kd = px(3.4)
    Object.assign(knob.style, { width: kd + "px", height: kd + "px", top: "50%", background: col(s.knob) })
    if (isObj(s.shadow)) knob.style.boxShadow = off(s.shadow.x) + "px " + off(s.shadow.y) + "px " + px(s.shadow.blur) + "px " + col(s.shadow.color)
    bar.append(track, fill, knob)
    const labels = div("barlabels")
    text(labels, sty("barLabel"))
    const l = span(""), m = span(""), rr = span("")
    labels.append(l, m, rr)
    wrap.append(bar, labels)
    // a finger along it (what pause and rewind keeps, a movie): the mark and
    // the time follow, and letting go sends the TV there, for what it was drawn for
    let drag = -1
    let dragPlay = null
    const along = (e) => {
      const r = bar.getBoundingClientRect ? bar.getBoundingClientRect() : { left: 0, width: 0 }
      return Math.max(0, Math.min(1, (fin(e.clientX) - r.left) / Math.max(1, r.width)))
    }
    const update = () => {
      const b = barInfo()
      if (drag >= 0 && !(b && b.knob)) drag = -1      // it can't seek there any more (left full screen, say): the drag's off
      wrap.style.display = b ? "" : "none"
      if (!b) return
      const a = drag >= 0 ? drag : b.at
      fill.style.width = (a * 100).toFixed(2) + "%"
      knob.style.left = (a * 100).toFixed(2) + "%"
      knob.style.display = b.knob ? "" : "none"
      let left = b.left
      if (drag >= 0 && b.kind === "live") left = drag > 0.995 ? "" : span2((1 - drag) * b.window * 1000) + " behind live"
      else if (drag >= 0 && b.kind === "movie") left = span2(drag * b.length * 1000)
      l.textContent = left; m.textContent = b.mid; rr.textContent = b.right
      labels.style.display = left || b.mid || b.right ? "" : "none"
    }
    bar.style.touchAction = "none"
    bar.addEventListener("pointerdown", (e) => {
      const b = barInfo()
      if (!b || !b.knob || typeof state.play !== "number") return
      drag = along(e)
      dragPlay = state.play
      if (bar.setPointerCapture && e.pointerId !== undefined) { try { bar.setPointerCapture(e.pointerId) } catch (err) {} }
      update()
    })
    bar.addEventListener("pointermove", (e) => { if (drag >= 0) { drag = along(e); update() } })
    bar.addEventListener("pointerup", (e) => {
      if (drag < 0) return
      const f = along(e)
      drag = -1
      const b = barInfo()
      update()
      if (b && b.knob) send("seek", { at: Math.round(f * 10000) / 10000, play: dragPlay })
    })
    bar.addEventListener("pointercancel", () => { drag = -1; update() })
    return { el: wrap, ticks: true, update }
  }

  // ---- the readout strip ----
  function strip(item, w, h) {

  // ---- the touch pad ----
  function swipe(item, w, h) {
    const g = div()
    Object.assign(g.style, { width: w + "px", height: h + "px", position: "relative", touchAction: "none", flex: "none", userSelect: "none" })
    const s = sty("swipe")
    looks(g, s)
    g.setAttribute("role", "button")
    g.setAttribute("aria-label", "Touch pad: swipe to move, tap for OK")
    const color = isObj(s.text) && s.text.color ? col(s.text.color) : "#888888"
    const m = Math.max(16, Math.min(w, h) * 0.07)
    const marks = [["up", w / 2 - m / 2, px(3)], ["down", w / 2 - m / 2, h - m - px(3)], ["left", px(3), h / 2 - m / 2], ["right", w - m - px(3), h / 2 - m / 2]]
    for (const [d, x, y] of marks) { const i = icon(d, m); Object.assign(i.style, { position: "absolute", left: x + "px", top: y + "px", color, opacity: "0.55" }); g.appendChild(i) }
    const ring = div()
    const rd = Math.max(14, Math.min(w, h) * 0.06)
    Object.assign(ring.style, { position: "absolute", left: (w - rd) / 2 + "px", top: (h - rd) / 2 + "px", width: rd + "px", height: rd + "px", borderRadius: "50%", border: "1.5px solid " + color, opacity: "0.55" })
    g.appendChild(ring)
    const glow = div()
    const gd = Math.round(px(12))
    const accent = col(tpl.colors && tpl.colors.accent)
    Object.assign(glow.style, { position: "absolute", width: gd + "px", height: gd + "px", borderRadius: "50%", pointerEvents: "none", display: "none",
                                background: accent, opacity: "0.35", filter: "blur(" + Math.round(gd / 4) + "px)" })
    g.appendChild(glow)
    const follow = (e) => {
      const r = g.getBoundingClientRect ? g.getBoundingClientRect() : { left: 0, top: 0 }
      glow.style.left = (e.clientX - r.left - gd / 2) + "px"; glow.style.top = (e.clientY - r.top - gd / 2) + "px"
    }
    let start = null
    g.addEventListener("pointerdown", (e) => { start = { x: e.clientX, y: e.clientY, t: Date.now() }; ring.style.opacity = "1"; glow.style.display = ""; follow(e) })
    g.addEventListener("pointermove", (e) => { if (start) follow(e) })
    g.addEventListener("pointerup", (e) => {
      ring.style.opacity = "0.55"
      glow.style.display = "none"
      if (!start) return
      const dx = e.clientX - start.x, dy = e.clientY - start.y
      start = null
      if (Math.hypot(dx, dy) < 18) return okPress()
      send(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"))
    })
    g.addEventListener("pointercancel", () => { start = null; ring.style.opacity = "0.55"; glow.style.display = "none" })
    return g
  }

  // ---- one control in its cell ----
  function control(item, w, h) {
    const n = item.control
    if (n === "gap") return null
    if (n === "now") return card(item, w, h)
    if (n === "tabs") return tabs(item, w, h)
    if (n === "dpad") return dpad(item, w, h)
    if (n === "rocker") return rocker(item, w, h)
    if (n === "pad") return numberPad(item, Math.floor(w * (item.scale || 1)), Math.floor(h * (item.scale || 1)))
    if (n === "status") return strip(item, w, h)
    if (n === "swipe") return swipe(item, w, h)
    if (n === "list") return list(item, w, h)
    if (n === "chup" || n === "chdown") return chKey(n, item, geoFor(n, w, h, item.scale, item.alt))
    return simpleKey(n, item, w, h)
  }

  // ---- laying out ----------------------------------------------------------------
  function padShown() { return prefs.pad === "on" || (prefs.pad !== "off" && (!tpl || tpl.pad !== "off")) }
  const HAS_KEYS = ["dpad", "pad", "rocker", "tabs"].concat(KEYS)
  function rowsNow() {
    let rows = (view.expanded && tpl.layout.expanded) ? tpl.layout.expanded : tpl.layout.portrait
    const pad = padShown()
    const keep = (r) => !r.pad || (r.pad === "on") === pad
    rows = rows.map((e) => e.panel ? Object.assign({}, e, { rows: e.rows.filter(keep) }) : e).filter((e) => e.panel ? e.rows.length : keep(e))
    // the guide tab: what's below the tabs gives way to the channel list
    if (view.tab === "guide") {
      const at = rows.findIndex((e) => !e.panel && e.row.some((it) => it.control === "tabs"))
      if (at >= 0) rows = rows.slice(0, at + 1).concat([{ row: [{ control: "list" }], height: 10, grow: true }])
    }
    return rows
  }
  // Splits rows into the left and right columns (sideways)
  function split(rows, left) {
    const part = (rs, want) => {
      const out = []
      for (const e of rs) {
        if (e.panel) { const inner = part(e.rows, want); if (inner.length) out.push(Object.assign({}, e, { rows: inner })); continue }
        const items = e.row.filter((it) => it.control === "gap" || (left.indexOf(it.control) >= 0) === want)
        if (items.some((it) => it.control !== "gap")) out.push(Object.assign({}, e, { row: items }))
      }
      return out
    }
    return [part(rows, true), part(rows, false)]
  }

  function column(rows, W, H, rise) {
    const c = div("col")
    c.style.width = W + "px"
    const gapPx = Math.round(2 * U)
    // what the panels take round their rows
    let fixed = 0, entries = 0
    const flat = []
    for (const e of rows) {
      entries += 1
      if (e.panel) {
        const ps = sty(e.panel)
        fixed += px(fin(ps.padding)) * 2 + (e.handle ? px(4) : 0) + gapPx * Math.max(0, e.rows.length - 1)
        for (const r of e.rows) flat.push(r)
      } else flat.push(e)
    }
    fixed += gapPx * Math.max(0, entries - 1)
    const avail = Math.max(120, H - fixed)
    // each row its share (never under a key's 44 px, the tabs' 32), then what's
    // left to the rows that grow; past the screen, the page scrolls
    const minOf = (r) => r.row.some((it) => it.control !== "tabs" && HAS_KEYS.indexOf(it.control) >= 0) ? 44
                       : r.row.some((it) => it.control === "tabs") ? 32 : r.row.every((it) => it.control === "gap") ? 0 : 24
    const sizes = new Map()
    let sum = 0, growing = 0
    for (const r of flat) { const hh = Math.max(minOf(r), Math.floor(avail * r.height / 100)); sizes.set(r, hh); sum += hh; if (r.grow) growing += 1 }
    const left = avail - sum
    if (left > 0 && growing) for (const r of flat) if (r.grow) sizes.set(r, sizes.get(r) + Math.floor(left / growing))
    const heightOf = (r) => sizes.get(r)
    c.style.gap = gapPx + "px"
    const drawRow = (r, rw) => {
      const rowEl = div("row" + (r.dim ? " dim" : ""))
      const hh = heightOf(r)
      const items = r.row.filter((it) => it.control !== "pad" || padShown())
      const gap = r.gap !== undefined ? px(r.gap) : Math.round(2 * U)
      Object.assign(rowEl.style, { height: hh + "px", width: rw + "px", gap: gap + "px" })
      let total = 0
      for (const it of items) total += it.weight || 1
      const free = rw - gap * Math.max(0, items.length - 1)
      for (const it of items) {
        const cw = Math.floor(free * (it.weight || 1) / total)
        const cell = div("cell")
        cell.style.width = cw + "px"
        const el = control(it, cw, hh)
        if (el) cell.appendChild(el)
        rowEl.appendChild(cell)
      }
      return rowEl
    }
    for (const e of rows) {
      if (!e.panel) { c.appendChild(drawRow(e, W)); continue }
      const p = div("panel" + (rise ? " rise" : ""))
      const ps = sty(e.panel)
      looks(p, ps)
      p.style.gap = gapPx + "px"
      const inner = W - px(fin(ps.padding)) * 2 - (isObj(ps.border) ? 2 * Math.max(1, px(fin(ps.border.width))) : 0)
      if (e.handle) {
        const g = div("grab")
        looks(g, sty("handle"))
        Object.assign(g.style, { width: px(10) + "px", height: Math.max(3, px(1)) + "px", marginBottom: px(0.6) + "px" })
        p.appendChild(g)
      }
      for (const r of e.rows) p.appendChild(drawRow(r, inner))
      c.appendChild(p)
    }
    return c
  }

  // Draws the page from the template (again only when something it depends on changed)
  function draw() {

      const named = rows.flatMap((e) => (e.panel ? e.rows : [e])).flatMap((r) => r.row.map((it) => it.control))
      const left = Array.isArray(ls.left) ? ls.left : Array.isArray(ls.right) ? named.filter((c) => ls.right.indexOf(c) < 0) : ["now", "dpad", "swipe", "list"]

        const yes = key("go", { el: "go", alone: true, over: { shape: "pill", place: "center" }, face: () => ({ label: "TURN ON" }), press: () => send("yes") })
        const no = key("key", { el: "key", alone: true, over: { shape: "pill", place: "center" }, face: () => ({ label: "DISMISS" }), press: () => send("no") })
        yes.style.flex = no.style.flex = "1"
        answers.append(yes, no)
        ask.append(p, answers)
      } else ask.style.display = "none"
    }
    codeSheet()
    settingsSheet()
  }

  // ---- the number being typed ----
  function typeDigit(d) {
    if (typed.length >= (state.passcode ? 8 : 5)) return
    typed += d
    overlays()
    clearTimeout(typedTimer)
    if (!state.passcode) typedTimer = setTimeout(goTyped, 1500)
  }
  function goTyped() {
    clearTimeout(typedTimer)
    if (state.passcode) { if (typed.length >= 4) send("code", { digits: typed }) }
    else if (typed) send("tune", { number: Number(typed) })
    typed = ""
    overlays()
  }

  // ---- the passcode pad: always there when the TV asks for it ----
  let codeEl = null
  function codeSheet() {
    if (!state.passcode) { if (codeEl) { codeEl.remove(); codeEl = null } return }
    if (!codeEl) {
      codeEl = div("shade")
      const sh = div("sheet")
      looks(sh, merge(sty("sheet"), { radius: [5, 5, 0, 0] }))
      if (!sh.style.padding) sh.style.padding = "16px"
      const dots = div()
      dots.id = "codeDots"
      looks(dots, sty("typed"))
      Object.assign(dots.style, { display: "flex", alignItems: "center", justifyContent: "center", gap: "12px", height: "64px", marginBottom: "12px" })
      const pin = numberPad({}, Math.min(innerWidth, 464) - 56, 4 * 54 + 24, true)
      sh.append(dots, pin)
      codeEl.appendChild(sh)
      document.body.appendChild(codeEl)
    }
    const dots = $("#codeDots")
    if (dots) {
      dots.textContent = ""
      const label = document.createElement("small"); label.textContent = "PASSCODE"; label.style.fontSize = "0.35em"
      dots.append(label, document.createTextNode("•".repeat(typed.length) || " "))
    }
  }

  // ---- ⚙: this phone's template, number pad and size; UNPAIR ----
  let sheetEl = null
  let sheetFor = ""
  const SIZES = { "-2": "Smallest", "-1": "Smaller", "0": "Normal", "1": "Larger", "2": "Largest" }
  function settingsSheet() {
    if (!view.settings) { if (sheetEl) { sheetEl.remove(); sheetEl = null } sheetFor = ""; return }
    const sig = JSON.stringify([tpl && tpl.id, rev, names, prefs, padShown()])
    if (sheetEl && sig === sheetFor) return
    sheetFor = sig
    const top0 = sheetEl && sheetEl.firstChild ? sheetEl.firstChild.scrollTop : 0
    if (sheetEl) sheetEl.remove()
    sheetEl = div("shade")
    sheetEl.addEventListener("click", (e) => { if (e.target === sheetEl) { view.settings = false; settingsSheet() } })
    const sh = div("sheet")
    looks(sh, merge(merge(sty("sheet"), { radius: [5, 5, 0, 0] }), {}))
    if (!sh.style.padding) sh.style.padding = "16px"
    const textColor = col(((sty("card").text || {}).color) || (tpl.colors && tpl.colors.text))
    sh.style.color = tpl.colors ? col(tpl.colors.text) : textColor
    sh.style.fontFamily = FAMILY[(tpl.fonts || {}).body] || FAMILY.system
    const top = div("top")
    const h2 = document.createElement("h2"); h2.textContent = "SETTINGS"
    const PILL = { shape: "pill", place: "center", icon: 5.5 }, ROW = { shape: "rect", radius: 3.3, place: "center" }
    const done = key("go", { el: "go", alone: true, over: PILL, face: () => ({ label: "DONE" }), geo: { width: "96px", height: "40px" }, press: () => { view.settings = false; settingsSheet() } })
    top.append(h2, done)
    sh.appendChild(top)
    const label = (t) => { const l = div("label"); l.textContent = t; return l }
    sh.appendChild(label("TEMPLATE"))
    const current = tpl.id
    for (const n of names) {
      if (!n || typeof n.id !== "string") continue
      const make = () => {
        const nm = document.createElement("b"); nm.textContent = String(n.name || n.id)
        const ds = document.createElement("small"); ds.textContent = String(n.description || "")
        return [nm, ds]
      }
      const b = key("key", { el: "key", alone: true, over: ROW, aria: String(n.name || n.id), geo: {}, on: () => n.id === current, face: () => ({ make }), press: () => choose({ template: n.id }) })
      b.classList.add("pick")
      sh.appendChild(b)
    }
    sh.appendChild(label("NUMBER PAD"))
    const pads = div("pair2")
    for (const v of ["on", "off"]) {
      const b = key("key", { el: "key", alone: true, over: PILL, geo: { flex: "1", height: "100%" }, on: () => (padShown() ? "on" : "off") === v, face: () => ({ label: v.toUpperCase() }), press: () => choose({ pad: v }) })
      pads.appendChild(b)
    }
    sh.appendChild(pads)
    sh.appendChild(label("SIZE"))
    const sizes = div("sizes")
    const size = Math.max(-2, Math.min(2, Math.round(fin(prefs.size))))
    const minus = key("key", { el: "key", alone: true, over: PILL, aria: "Smaller", geo: { width: "64px", height: "100%" }, unavailable: () => size <= -2, face: () => ({ label: "−" }), press: () => choose({ size: size - 1 }) })
    const plus = key("key", { el: "key", alone: true, over: PILL, aria: "Larger", geo: { width: "64px", height: "100%" }, unavailable: () => size >= 2, face: () => ({ label: "+" }), press: () => choose({ size: size + 1 }) })
    sizes.append(minus, span(SIZES[String(size)]), plus)
    sh.appendChild(sizes)
    const unpair = key("power", { el: "power", alone: true, over: PILL, geo: {}, face: () => ({ label: "UNPAIR" }), press: forget })
    unpair.classList.add("unpair")
    sh.appendChild(unpair)
    // these keys belong to the sheet, not the page's updaters
    sheetEl.appendChild(sh)
    document.body.appendChild(sheetEl)
    sh.scrollTop = top0
  }
  async function forget() {
    if (!confirm("Unpair this phone? You'll need a new code from the TV to use it again.")) return
    await post("/api/forget").catch(() => null)
    if (events) events.close()
    view.settings = false
    settingsSheet()
    show("pair")
  }

  $("#gear").addEventListener("click", (e) => { e.preventDefault(); view.settings = true; settingsSheet() })
  $("#pairButton").addEventListener("click", pair)
  $("#code").addEventListener("keydown", (e) => { if (e.key === "Enter") pair() })
  $("#code").addEventListener("input", (e) => { e.target.value = e.target.value.replace(/\D/g, ""); if (e.target.value.length === 6) pair() })
